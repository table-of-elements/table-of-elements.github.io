  teaser_de: Ein Backlog ist eine geordnete Liste aller Aufgaben, Features, Anforderungen
    und Arbeitspakete, die in einem Projekt erledigt werden müssen. Die Liste wird
    von oben nach unten priorisiert und zwar nach dem Wert der Anforderungen für den
    Kunden. Anforderungen, die ganz oben auf der Liste stehen, werden zuerst realisiert
    und sind sehr detailliert, während Aufgaben, die weiter unten auf der Liste stehen,
    zunächst nur rudimentär beschrieben werden.
  teaser_en: A backlog is an ordered list of all tasks, features, requirements and
    work packages that need to be completed in a project. The list is prioritized
    from top to bottom according to the value of the customer's requirements. Requirements
    at the top of the list are implemented first and are very detailed, while tasks
    further down the list are initially only described in rudimentary terms.
  context_de: Das Backlog wird gemeinsam erstellt. Die Pflege obliegt in Scrum dem
    Product Owner und wird insbesondere in agilen Projekten kontinuierlich im Projekt
    verwendet.
  context_en: The backlog is created jointly. In Scrum the Product Owner is responsible
    for maintenance and it is used continuously in the project, especially in agile
    projects.
  tip_de: "Kombinieren Sie Backlogs mit Burndown Charts (BC), um den Fortschritt besser messen und vorhersagen zu können."
  tip_en: "Combine backlogs with Burndown Charts (BC) to better measure and predict progress."
