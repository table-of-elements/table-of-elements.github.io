    und Perspektiven, indem Teilnehmer zwischen einer inneren und äußeren Gesprächsrunde
    wechseln.
  teaser_en: The Fishbowl method is a facilitation tool that enables dynamic and open
    discussions in large groups. It promotes the exchange of ideas and perspectives
    by allowing participants to switch between an inner and outer discussion circle.
  context_de: Die Fishbowl-Methode eignet sich für Diskussionen in größeren Gruppen.
    Die Diskutantinnen und Diskutanten im inneren Kreis erhalten die volle Aufmerksamkeit
    der Zuhörerinnen und Zuhörer, aber jede Teilnehmerin und jeder Teilnehmer im äußeren
    Kreis hat die Möglichkeit, sich einzubringen und so eigene Inhalte beizusteuern.
  context_en: The fishbowl method works well for large group discussions. Discussants
    in the inner circle have the full attention of the audience, but each participant
    in the outer circle has the opportunity to contribute their own content.
  tip_de: Stellen Sie sicher, dass alle Teilnehmer die Regeln verstehen und sich daran
    halten.
  tip_en: Make sure everyone understands and follows the rules.
