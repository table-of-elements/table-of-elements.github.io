  teaser_de: 'Der Prozess des Claim Managements umfasst die Identifikation, Bewertung
    und Verhandlung von Ansprüchen (Englisch: Claims) im Projektmanagement. Der Fokus
    von Claims liegt nicht auf der Durchsetzung bereits vertraglich vereinbarter Ansprüche,
    sondern auf Ansprüchen, die darüber hinausgehen, beispielsweise bei Planabweichungen
    oder Mängeln. Claim Management stellt sicher, dass alle vertraglichen Vereinbarungen
    eingehalten werden, bietet eine strukturierte Vorgehensweise zur Lösung von Streitigkeiten
    und zur Minimierung finanzieller Risiken.'
  teaser_en: The claims management process involves the identification, evaluation
    and negotiation of claims in project management. The focus of claims is not on
    enforcing issues that have already been contractually agreed upon, but on claims
    that go beyond that, such as deviations from the plan or defects. Claim management
    ensures that all contractual agreements are met and provides a structured approach
    to resolving disputes and minimizing financial risk.
  context_de: Erfordert die Zusammenarbeit von Projektmanagement, Rechtsabteilung
    und anderen Beteiligten. Claim Management wird kontinuierlich eingesetzt, um Ansprüche
    zu identifizieren und zu bearbeiten.
  context_en: Requires cooperation between project management, legal department and
    other stakeholders. Claim management is used continuously to identify and process
    claims.
