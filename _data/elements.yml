    of focused work followed by 17 minutes of rest. This structure helps maintain
    focus while incorporating regular breaks for recovery.
  context_de: "Kann in jeder Projektphase individuell zur Steigerung der eigenen Produktivität\
    \ eingesetzt werden. \nEs hilft, sich zu fokussieren und bietet gleichzeitig Raum\
