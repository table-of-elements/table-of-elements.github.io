  teaser_de: Der Elevator Pitch ist eine kurze, prägnante Präsentation einer Idee,
    eines Projekts oder eines Produkts. Ziel ist es, in der Zeit einer Aufzugsfahrt
    (ca. 30 Sekunden bis 2 Minuten) das Interesse der Zuhörer zu wecken.
  teaser_en: The elevator pitch is a short, concise presentation of an idea, project,
    or product. The goal is to capture the listener's interest in the span of an elevator
    ride (approximately 30 seconds to 2 minutes).
  context_de: Natürlich ist es sinnvoll, den Elevator Pitch im Team zu entwickeln,
    aber manchmal brauchen Sie ihn, um Ihr Projekt oder Thema auf den Weg zu bringen
    und ein Team zusammenzustellen. Er ist besonders nützlich, um Ideen oder Projekte
    in frühen Phasen zu präsentieren. Der Elevator Pitch unterstützt die effektive
    und schnelle Kommunikation von Kernideen und hilft, Inhalte auf den Punkt zu bringen.
  context_en: Of course, it makes sense to develop the elevator pitch as a team, but
    sometimes you need it to get your project or issue off the ground and to build
    a team. It is especially useful for presenting ideas or projects in the early
    stages. The Elevator Pitch helps you communicate your core ideas effectively and
    quickly, and helps you get to the point.
  tip_de: Beenden Sie Ihren Pitch mit einem klaren "Call to Action" - einer Aufforderung,
    die nächsten Schritte zu besprechen, ein Treffen zu vereinbaren oder Kontaktdaten
    auszutauschen.
  tip_en: End your pitch with a clear "call to action." Ask to discuss next steps,
    set up a meeting, or exchange contact information.
