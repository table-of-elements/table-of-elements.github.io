  teaser_de: Eine Persona ist ein fiktiver Charakter, der auf realen Daten und Recherchen
    basiert und die Zielgruppe eines Produkts oder Projekts repräsentiert. Sie hilft,
    die Bedürfnisse, Verhaltensweisen und Ziele der Nutzer besser zu verstehen.
  teaser_en: A persona is a fictional character based on real data and research that
    represents the target group of a product or project. It helps to gain a better
    understanding of users' needs, behaviors and goals.
