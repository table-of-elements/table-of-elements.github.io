    state of a project. It includes information on progress, issues, and next steps
    and supports communication with stakeholders.
  context_de: Die Erstellung eines Statusberichts ist in der Regel Aufgabe des Projektleiters
    oder einer beauftragten Person. Um die Informationen zu sammeln, ist jedoch die
    Kommunikation mit dem Team erforderlich. Der Statusbericht dient zur regelmäßigen
    Aktualisierung und zur Überwachung des Fortschritts.
