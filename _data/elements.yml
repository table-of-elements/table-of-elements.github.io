  teaser_de: 'Bei der Umfeldanalyse (Englisch: Environmental Analysis) handelt es
    sich um einen Ansatz, mit dem die externen Einflüsse auf ein Projekt oder eine
    Organisation identifiziert und bewertet werden können. Sie hilft, Chancen und
    Risiken, die sich aus dem externen Umfeld ergeben, zu erkennen und die Anforderungen
    und Stakeholder besser zu verstehen.'
  teaser_en: Environmental analysis is an approach to identify and assess external
    influences on a project or organization. It helps to detect opportunities and
    risks arising from the external environment and to better understand requirements
    and stakeholders.
  context_de: Eine Person allein kann kaum alle Facetten des Umfelds abdecken. Die
    Erarbeitung im Team stellt zudem sicher, dass alle Beteiligten ein gemeinsames
    Verständnis des Umfeldes und der Aufgabenstellung entwickeln. Natürlich ist es
    besonders sinnvoll, sich von Anfang an in einem Projekt mit dem jeweiligen Umfeld
    auseinander zu setzen.
  context_en: No one person can cover all aspects of the environment. Working as a
    team also ensures that everyone involved develops a common understanding of the
    environment and the task at hand. It is particularly useful to consider the environment
    from the start of a project.
  tip_de: Halten Sie die Umfeldanalyse regelmäßig auf dem neuesten Stand, um auf Veränderungen
    im externen Umfeld reagieren zu können.
  tip_en: Update the Environmental Analysis regularly to respond to changes in the
    external environment.
