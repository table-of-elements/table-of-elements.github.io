  teaser_de: Das Paretodiagramm ist ein spezielles Balkendiagramm zur Identifikation
    und Priorisierung von Ursachen, Problemen oder Fehlern. Es basiert auf dem Pareto-Prinzip,
    das besagt, dass 80 % der Auswirkungen von 20 % der Ursachen stammen.
  teaser_en: The Pareto Chart is a special bar chart for identifying and prioritizing
    causes, problems or errors. It is based on the Pareto principle, which states
    that 80% of the effects come from 20% of the causes.
  context_de: Die Erstellung eines Paretodiagramms erfolgt in der Regel durch eine
    Person. Die Anwendung ist nicht an einen bestimmten Zeitpunkt gebunden, sondern
    sollte dann erfolgen, wenn Probleme identifiziert und priorisiert werden müssen.
  context_en: A Pareto chart is usually created by one person. It is not tied to a
    specific point in time, but should be used when problems need to be identified
    and prioritized.
  tip_de: Verwenden Sie Softwaretools wie Excel oder spezielle Qualitätsmanagementsoftware,
    um Paretodiagramme effizient zu erstellen.
  tip_en: Use software tools such as Excel or specialized quality management software
    to create Pareto charts efficiently.
