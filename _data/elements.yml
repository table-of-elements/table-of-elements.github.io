    \ Inkrements, wenn es die für das Produkt erforderlichen Qualitätskriterien erfüllt."
  teaser_en: "The Definition of Done is a clear and consensus-based catalog of criteria\
    \ that describes when a task, user story or increment can be considered complete.\
    \ It ensures that all work is completed in full and to a high standard. \n\nAccording\
    \ to the Scrum Guide, the Definition of Done is defined as a formal description\
    \ of the status of an increment when it fulfills the quality measures required\
    \ for the product."
