  teaser_de: Die „5 Warum“-Methode ist eine Technik der Ursachenermittlung, bei der
    fünfmal die Frage „Warum?“ gestellt wird, um die zugrundeliegenden Ursachen eines
    Problems oder einer Situation zu identifizieren und nicht nur die Symptome zu
    behandeln.
  teaser_en: The "5 Whys" method is a root cause identification technique in which
    the question "Why?" is asked five times in order to identify the underlying causes
    of a problem or situation and not just to treat the symptoms.
  context_de: 'Kann vor allem allein zur Reflexion komplexer Probleme eingesetzt werden.


    Im Projektverlauf erweist sich die Methode insbesondere zur schnellen und effektiven
    Ursachenanalyse bei auftretenden Problemen als hilfreich.'
  context_en: 'Can be used alone to reflect on complex problems.


    In the course of a project, the method is particularly useful for quickly and
    effectively analyzing the causes of problems that arise.'
  tip_de: Seien Sie geduldig und gehen Sie in die Tiefe, um die wahren Ursachen zu
    finden.
  tip_en: Be patient and go into detail to find the real causes.
