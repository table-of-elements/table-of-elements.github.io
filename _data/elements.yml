  teaser_de: 'Die Theory of Constraints ist eine Managementphilosophie nach Eliyahu
    M. Goldratt, die darauf abzielt, Engpässe in einem System zu identifizieren und
    zu optimieren, um die Gesamtleistung zu verbessern. Ein Engpass ist dabei der
    limitierende Faktor, der den Durchsatz eines Systems bestimmt.


    Ebenfalls engpassorientiert ist das Konzept des kritischen Pfades, bei dem alle
    Aktivitäten ohne Pufferzeiten im Mittelpunkt stehen. Verzögert sich eine solche
    Aktivität, verzögert sich automatisch die Dauer des gesamten Projekts.'
  teaser_en: 'The Theory of Constraints is a management philosophy according to Eliyahu
    M. Goldratt that aims to identify and optimize bottlenecks in a system in order
    to improve overall performance. A bottleneck is the limiting factor that determines
    the throughput of a system.


    The concept of the critical path, which focuses on all activities without buffer
    times, is also bottleneck-oriented. If one such activity is delayed, the duration
    of the entire project is automatically delayed.'
  context_de: "Die Theory of Constraints (TC) bietet eine strukturierte Methode zur\
    \ Prozessverbesserung und ist in verschiedenen Branchen und Bereichen anwendbar.\
    \ \n\nDer kritische Pfad ist eine typische Projektmanagement-Betrachtung."
  context_en: 'The Theory of Constraints (TC) offers a structured method for process
    improvement and can be applied in various industries and areas.


    The critical path is a typical project management approach.'
