    manager or a designated person. However, communication with the team is required
    in order to collect the information. The status report is used for regular updates
    and to monitor progress.
  tip_de: 'Ampeln als Stilmittel zur Visualisierung von Zuständen verwenden


    🔴Rot: Das Projektziel wird nicht erreicht. Es müssen Maßnahmen ergriffen und Entscheidungen
    getroffen werden.


    🟡Gelb: Das Projektziel ist gefährdet. Maßnahmen sind erforderlich, um das Projekt
    wieder auf Kurs zu bringen.


    🟢Grün: Das Projektziel wird erreicht. Maßnahmen sind derzeit nicht erforderlich.'
  tip_en: 'Use traffic lights as a stylistic device to visualize states


    🔴Red: The project objective will not be achieved. Measures must be taken and decisions
    made.


    🟡Yellow: The project objective is at risk. Measures are required to get the project
    back on track.


    🟢Green: The project objective is being achieved. No measures are currently required.'
