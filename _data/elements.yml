  context_en: "Brainwriting requires several people to work together to generate a variety of ideas or solve problems. \n\nIn comparison to brainstorming (BR), brainwriting also takes up the ideas of others, but in a silent reflection. In brainstorming, on the other hand, the participants are directly influenced by the course of the discussion."
  tip_de: Sorgen Sie für eine ruhige, störungsfreie Atmosphäre und stellen Sie sicher,
