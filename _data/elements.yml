  teaser_de: "Das Mittelanalyse (Englisch: Inventory of Means) oder die Mittelanalyse ist eine Methode zur systematischen Erfassung und Bewertung aller vorhandenen Ressourcen und Mittel. Sie hilft, einen Überblick über die vorhandenen Ressourcen zu erhalten, um diese bei Bedarf einsetzen zu können. Die Mittelorientierung ist ein wesentliches Konzept der Effectuation (EF)."
  teaser_en: "The Inventory of Means is a method for systematically recording and evaluating all available resources and funds. It helps to gain an overview of available resources so that they can be used as needed. Inventory of Means is an essential concept of Effectuation (EF)."
  context_de: 'Während in der Effectuation eine Unternehmerin oder ein Unternehmer
    die Frage nach den verfügbaren Mitteln für sich selbst stellt, macht es in Projekten
    natürlich mehr Sinn, diese Analyse für das gesamte Team zu durchzuführen.


    Besonders nützlich zu Beginn und während des Projekts, um mit den verfügbaren
    Mitteln eine Problemlösung zu erarbeiten.'
  context_en: 'While in effectuation an entrepreneur asks the question of the inventory
    of means for himself or herself, in projects it naturally makes more sense to
    carry out the inventory of means for the entire team.


    Particularly useful at the beginning and during the project in order to work out
    a solution to a problem with the available resources.'
  tip_de: Natürlich müssen Sie Ihr Ressourceninventar ständig anpassen und aktualisieren.
    Seien Sie flexibel und bereit, neue Ressourcen oder Kontakte zu nutzen, die sich
    während der Arbeit an Ihrem Projekt ergeben.
  tip_en: Of course, you need to constantly adapt and update your toolbox. Be flexible
    and ready to tap into new resources or contacts as you work on your project.
